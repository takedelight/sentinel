name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Full check
        run: bun run fullcheck

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
      - name: Check for Go sources
        id: check
        run: |
          if compgen -G "apps/agent/*.go" > /dev/null; then
            echo "has_sources=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sources=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Vet and test
        if: steps.check.outputs.has_sources == 'true'
        run: |
          go vet ./apps/agent/...
          go test ./apps/agent/...
